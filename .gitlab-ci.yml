# CI for the walking skeleton (doc §11, §13). Every job has a local equivalent; see docs/guides/ci.md.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages: [check, verify, package, smoke, sign]

default:
  interruptible: true

variables:
  APP_IMAGE: $CI_REGISTRY_IMAGE/app:$CI_COMMIT_SHA
  # docker:dind without TLS on the job-private network; see docs/guides/ci.md to switch to TLS.
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

.dind:
  services:
    - name: docker:29-dind
      alias: docker

.docker-cli:
  extends: .dind
  image: docker:29-cli
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

secrets:gitleaks:
  stage: check
  image:
    name: zricethezav/gitleaks:v8.30.1
    entrypoint: [""]
  variables:
    GIT_DEPTH: "0"
  script:
    - gitleaks git --config .gitleaks.toml --redact --verbose .

backend:verify:
  stage: verify
  extends: .dind
  image: eclipse-temurin:25-jdk-noble
  variables:
    MAVEN_OPTS: -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository
    TESTCONTAINERS_HOST_OVERRIDE: docker
  cache:
    key: maven
    paths: [.m2/repository]
  script:
    - ./mvnw -B -ntp verify
  artifacts:
    when: always
    expire_in: 30 days
    reports:
      junit: "**/target/surefire-reports/TEST-*.xml"
    paths:
      - app/target/classes/META-INF/sbom/application.cdx.json
      - app/target/generated-sources/license/THIRD-PARTY.txt

frontend:verify:
  stage: verify
  image: node:24.21.0-bookworm-slim
  cache:
    key:
      files: [web/pnpm-lock.yaml]
    paths: [.pnpm-store]
  before_script:
    - corepack enable
    - cd web
    - pnpm install --frozen-lockfile --store-dir "$CI_PROJECT_DIR/.pnpm-store"
  script:
    - pnpm format:check
    - pnpm lint
    - pnpm typecheck
    - pnpm test
    - pnpm build
    - pnpm licenses:check

image:build:
  stage: package
  extends: .docker-cli
  script:
    - docker buildx create --use --driver docker-container
    - >
      docker buildx build
      --file deploy/docker/app.Dockerfile
      --build-arg VERSION="$CI_COMMIT_SHORT_SHA"
      --sbom=true --provenance=mode=max
      --metadata-file build-meta.json
      --tag "$APP_IMAGE" --push .
    - |
      echo "APP_IMAGE_DIGEST=$(sed -n 's/.*"containerimage.digest": *"\([^"]*\)".*/\1/p' build-meta.json)" > image.env
    - cat image.env
  artifacts:
    reports:
      dotenv: image.env

smoke:compose:
  stage: smoke
  extends: .docker-cli
  needs: [image:build]
  variables:
    SKIP_BUILD: "1"
  script:
    # Test the exact bytes that image:sign signs: the digest, never the mutable tag.
    - test -n "${APP_IMAGE_DIGEST:-}" || { echo "APP_IMAGE_DIGEST is empty (image:build dotenv missing)"; exit 1; }
    - export ERP_APP_IMAGE="$CI_REGISTRY_IMAGE/app@$APP_IMAGE_DIGEST"
    - apk add --no-cache bash
    - deploy/compose/smoke.sh
  artifacts:
    when: always
    expire_in: 14 days
    paths: [deploy/compose/smoke-logs/]
    reports:
      junit: deploy/compose/smoke-logs/reports/junit.xml

image:sign:
  stage: sign
  extends: .docker-cli
  needs: [image:build, smoke:compose]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  script:
    - apk add --no-cache cosign
    - cosign sign --yes --key env://COSIGN_PRIVATE_KEY "$CI_REGISTRY_IMAGE/app@$APP_IMAGE_DIGEST"
