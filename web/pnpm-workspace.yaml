packages:
  - packages/*
  - apps/*
  - e2e

# vue-demi's postinstall only selects a Vue 2/3 shim; Vue 3 is the default, so the script stays denied.
allowBuilds:
  vue-demi: false

# Single source of truth for frontend versions (the web counterpart of the Maven BOM).
# TypeScript stays on 6.x: typescript-eslint 8.71 supports `>=4.8.4 <6.1.0`.
catalog:
  '@mdi/js': 7.4.47
  '@playwright/test': 1.63.0
  '@tanstack/vue-query': 5.104.1
  '@types/node': 24.19.1
  '@vitejs/plugin-vue': 6.0.9
  '@vue/eslint-config-prettier': 10.2.0
  '@vue/eslint-config-typescript': 14.9.0
  '@vue/test-utils': 2.5.1
  eslint: 10.12.0
  eslint-plugin-vue: 10.11.1
  jsdom: 30.1.2
  prettier: 3.9.9
  typescript: 6.0.3
  typescript-eslint: 8.71.0
  vite: 8.3.2
  vite-plugin-vuetify: 2.1.3
  vitest: 5.0.3
  vue: 3.5.43
  vue-i18n: 11.4.13
  vue-tsc: 3.3.12
  vuetify: 4.2.3
