# Local development against `docker compose --profile dev`. Secrets come from the file generated by
# deploy/compose/init-env.sh; both paths cover running from the repo root and from app/.
spring:
  config:
    import:
      - optional:file:./deploy/compose/.env[.properties]
      - optional:file:../deploy/compose/.env[.properties]
  datasource:
    password: ${ERP_PLATFORM_DB_PASSWORD}
